# hostsync - /etc/keyd/hostsync.conf
#
# Por que keyd y no un bind del compositor: sobrevive la migracion a
# Hyprland/Omarchy. keyd trabaja sobre evdev, debajo de X11 y de Wayland, asi
# que el dia que cambies de compositor esto no se entera.
#
# El [ids] apunta SOLO al Adv360 (1d50:615e). Si algun dia otro teclado manda
# un F13, no queremos que mueva el mouse.
#
# COMO AVERIGUAR EL ID DE TU PROPIO TECLADO
#
#   sudo keyd monitor
#
# Apreta cualquier tecla: keyd imprime lineas como
#
#   1d50:615e  /dev/input/event5  Kinesis Advantage360 Keyboard
#
# El vid:pid de esa linea es lo que va abajo, en minusculas. Alternativas:
#
#   sudo keyd -m          # equivalente en versiones viejas
#   lsusb                 # si esta por cable
#
# Si tu Adv360 reporta otro id (revision distinta del firmware, o lo usas por
# cable en vez de Bluetooth), cambia la linea. Podes poner varios ids, uno por
# renglon. El comodin "*" agarra TODOS los teclados: no lo uses aca, porque
# cualquier F13 de cualquier teclado moveria el mouse.
#
# command() no reenvia la tecla a las aplicaciones: F13/F14/F15 quedan
# consumidas aca, que es lo que queremos. Son teclas testigo, no teclas.

[ids]
1d50:615e

[main]
f13 = command(/usr/local/bin/hostsync-switch f13)
f14 = command(/usr/local/bin/hostsync-switch f14)
f15 = command(/usr/local/bin/hostsync-switch f15)
