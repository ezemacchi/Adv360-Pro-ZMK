# ============================================================================
# hosts.example.toml - PLANTILLA. Copiala a hosts.toml y completala.
#
#     cp hostsync/hosts.example.toml hostsync/hosts.toml
#
# Los valores marcados con 999 y "cambiame" son de mentira A PROPOSITO:
# mxswitch.py los detecta y se niega a correr con un mensaje claro, para que
# nadie crea que instalo algo que funciona cuando en realidad copio la
# plantilla y no la toco.
#
# COMO COMPLETARLA
#
#   1. python3 hostsync/mxswitch.py --discover
#      Te lista los slots reales del mouse con nombre y direccion, y te imprime
#      bloques [[hosts]] listos para pegar aca.
#   2. Ajusta bt_profile al perfil Bluetooth del TECLADO (el numero de
#      &bt BT_SEL n del keymap), que no tiene por que coincidir con el slot
#      del mouse.
#   3. python3 hostsync/mxswitch.py --list && \
#      python3 hostsync/mxswitch.py --verify-keymap
#
# Guia completa: hostsync/SETUP.md
# ============================================================================

[mouse]
# Identificacion del dispositivo. NUNCA por path (/dev/hidrawN cambia entre
# reboots y al pasar de receptor a Bluetooth directo).
#
# Tampoco por MAC: el MX Master 3S usa una direccion BLE DISTINTA POR SLOT.
# Matchear por MAC se rompe justo cuando el mouse hace lo unico que importa.
vendor_id  = 0x046D          # Logitech
product_id = 0xB034          # MX Master 3S por BLE directo.
                             # SI TU MOUSE ES OTRO, ESTE NUMERO CAMBIA.
                             # Linux:   lsusb / cat /sys/class/hidraw/*/device/uevent
                             # Windows: python -c "import hid; print(hid.enumerate(0x046D,0))"
name_hint  = "MX Master 3S"  # desempate si hubiera dos mouses iguales

[timing]
# Espera del listener antes de mandar el HID++, para no pisar al teclado.
pre_switch_delay_ms = 0

# Cuanto esperamos a que el mouse se desconecte = confirmacion de exito.
# Si sigue conectado pasado esto, la orden se perdio.
verify_timeout_ms = 2500

# Reintentos si la orden se perdio (mouse en suspension profunda).
retries = 2
retry_delay_ms = 400

# Ventana de deduplicacion. El keymap manda la tecla testigo DOS VECES a
# proposito (el ADV360 duerme a los 30s y el primer report al despertar se
# puede perder). Dos pulsaciones del mismo testigo dentro de esta ventana
# cuentan como una sola.
dedup_window_ms = 600

[notify]
enabled = true
timeout_ms = 2000

# ============================================================================
# EL MAPA. Perfil BT del teclado <-> slot del mouse <-> tecla testigo.
#
# Un bloque [[hosts]] por computadora. Todos los campos son obligatorios
# salvo los marcados como opcionales.
#
#   id          numero libre, unico. Sirve para 'mxswitch.py --host 2'.
#   name        identificador corto en minusculas, unico, sin espacios.
#               Tiene que coincidir con la macro del keymap:
#               name "arch" -> macro hostsync_arch (los guiones pasan a "_").
#   label       texto lindo para las notificaciones. Opcional (default: name).
#   bt_profile  0-BASED. El n de '&bt BT_SEL n' en el keymap.
#   mouse_slot  0-BASED. slot 1 del boton Easy-Switch = 0.
#   witness     tecla testigo: f13 / f14 / f15. Unica por host. Es la tecla
#               que la macro manda al host ACTUAL antes de irse.
#   switchable  opcional, default true. En false el listener rechaza el
#               switch (codigo 7). Ver el tercer bloque.
#   this_host   opcional. Marca el host donde corre ESTE listener.
#   same_machine_as  opcional, solo documenta por que algo no es conmutable.
# ============================================================================

[[hosts]]
id         = 1
name       = "cambiame-1"
label      = "Mi Windows"
bt_profile = 999                     # &bt BT_SEL 0  -> poner 0
mouse_slot = 999                     # slot 1 del Easy-Switch -> poner 0
witness    = "f13"
switchable = true

[[hosts]]
id         = 2
name       = "cambiame-2"
label      = "Mi Linux (esta maquina)"
bt_profile = 999                     # &bt BT_SEL 1  -> poner 1
mouse_slot = 999                     # slot 2 del Easy-Switch -> poner 1
witness    = "f14"
switchable = true
this_host  = true

# Tercer bloque: ejemplo de un host que NO conviene conmutar.
#
# Si --discover te muestra dos slots con la MISMA direccion de adaptador,
# son el mismo equipo fisico (tipico dual boot) y nunca corren a la vez.
# Saltar ahi te deja sin teclado ni mouse, sin vuelta atras por software:
# el ADV360 no acepta ordenes del host, que es la premisa de todo el diseño.
#
# Con switchable = false el listener avisa y no hace nada. Eso protege al
# mouse, pero NO puede impedir que el teclado salte igual: la unica proteccion
# real es no bindear la macro a ninguna tecla en el keymap.
#
# Si tu tercer host es un equipo de verdad, pone switchable = true, saca
# same_machine_as, y bindea la macro.
[[hosts]]
id         = 3
name       = "cambiame-3"
label      = "Windows (dual boot)"
bt_profile = 999                     # &bt BT_SEL 2  -> poner 2
mouse_slot = 999                     # slot 3 del Easy-Switch -> poner 2
witness    = "f15"
switchable = false
same_machine_as = "cambiame-2"
